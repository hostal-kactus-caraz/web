<!-- JavaScript con Validación Estricta de Clave -->
  <script>
    function unlockGuide() {
      const pass = document.getElementById('passInput').value;
      const secretSection = document.getElementById('secretGuide');

      // Solo si la clave es exactamente 301298 se muestra el contenido
      if (pass.trim() === '301298') {
        secretSection.style.display = 'block';
      } else {
        secretSection.style.display = 'none';
        alert('Contraseña incorrecta. Por favor solicita la clave oficial (301298) en recepción.');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') unlockGuide();
    }

    function toggleFaq(element) {
      const answer = element.querySelector('.faq-answer');
      const isVisible = answer.style.display === 'block';
      answer.style.display = isVisible ? 'none' : 'block';
    }

    const translations = {
      es: {
        subtitle: "Tu descanso cómodo, seguro y completo en Caraz, Perú",
        titleRooms: "Nuestras Habitaciones",
        btnRes: "Reservar por WhatsApp"
      },
      en: {
        subtitle: "Your comfortable, safe, and complete stay in Caraz, Peru",
        titleRooms: "Our Rooms",
        btnRes: "Book via WhatsApp"
      }
    };

    function changeLanguage(lang) {
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${lang}`);
      if (activeBtn) activeBtn.classList.add('active');

      if(translations[lang]) {
        document.getElementById('sub-title').innerText = translations[lang].subtitle;
        document.getElementById('title-rooms').innerText = translations[lang].titleRooms;
        document.querySelectorAll('.btn-res-text').forEach(el => el.innerText = translations[lang].btnRes);
      }
    }
  </script>
